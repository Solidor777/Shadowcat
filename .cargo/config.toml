# Repo-scoped build CPU budget.
#
# A cold build of the workspace runs one rustc per available core (measured: 23 concurrent
# processes at 99% CPU on a 24-core machine), which starves the desktop for the duration --
# and the browser e2e script begins with exactly this build, so the stall lands the moment a
# developer starts the suite.
#
# This file applies only to cargo invocations made from inside this repository, so it imposes
# nothing on other Rust projects on the machine. Cargo reads `CARGO_BUILD_JOBS` ahead of this
# value, so any invocation can opt out or pick its own budget without editing the repo:
#
#     CARGO_BUILD_JOBS=24 cargo build      # this machine's full parallelism, one command
#     CARGO_BUILD_JOBS=4  cargo test       # a tighter budget while doing something else
#
# This budget is for a machine the build SHARES with the person running it. Cargo does not clamp
# this value to the host's parallelism -- measured: 40 requested yields 32 concurrent rustc on 24
# logical cores -- so on a host with fewer cores than this it RAISES concurrency instead of
# lowering it, multiplying peak memory rather than trimming CPU. A build host that competes with
# nothing therefore sets `CARGO_BUILD_JOBS` to its own width and ignores this file.
[build]
jobs = 12

# Repo-scoped TEST-RUNNER CPU budget — a separate knob from `[build] jobs` above, which only
# bounds compilation. `cargo test --all --doc` compiles ~873 tiny doctest binaries then RUNS them
# with libtest's own default thread count (unbounded, typically num_cpus) — on this 24-core
# shared desktop that means dozens of doctest processes contending for CPU simultaneously.
# Measured: `sandbox::runtime::run_validator`'s doctest — which exercises the PRODUCTION
# `HANG_GUARD` (250ms; deliberately tight, a real security budget for third-party WASM code, not
# a value this file should loosen) around a `tokio::spawn_blocking` call — spuriously fails as
# `Fault(Hung)` under full default-thread-count doctest concurrency, because `spawn_blocking`'s
# OWN scheduling latency (not the WASM call itself, which completes in low single-digit
# milliseconds) can exceed 250ms when dozens of sibling doctest processes are all contending for
# the same cores. The doctest passes reliably in isolation and at a bounded thread count; this is
# host contention, not a code defect, and the fix belongs here (bound the test runner's own
# concurrency) rather than in the sandbox module (loosening its real security timeout to
# accommodate a crowded test run would trade a genuine guarantee for local convenience).
# Rust's libtest reads `RUST_TEST_THREADS` for both unit tests and doctests; unlike
# `CARGO_BUILD_JOBS`, cargo has no dedicated test-thread-count field, so this repo sets the
# environment variable libtest itself honors. As with `CARGO_BUILD_JOBS`, any invocation may
# override this by setting `RUST_TEST_THREADS` itself before running cargo.
[env]
RUST_TEST_THREADS = "4"
