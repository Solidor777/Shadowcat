# Repo-scoped build CPU budget.
#
# A cold build of the workspace runs one rustc per available core (measured: 23 concurrent
# processes at 99% CPU on a 24-core machine), which starves the desktop for the duration --
# and the browser e2e script begins with exactly this build, so the stall lands the moment a
# developer starts the suite.
#
# This file applies only to cargo invocations made from inside this repository, so it imposes
# nothing on other Rust projects on the machine. Cargo reads `CARGO_BUILD_JOBS` ahead of this
# value, so any invocation can opt out or pick its own budget without editing the repo:
#
#     CARGO_BUILD_JOBS=24 cargo build      # this machine's full parallelism, one command
#     CARGO_BUILD_JOBS=4  cargo test       # a tighter budget while doing something else
#
# This budget is for a machine the build SHARES with the person running it. Cargo does not clamp
# this value to the host's parallelism -- measured: 40 requested yields 32 concurrent rustc on 24
# logical cores -- so on a host with fewer cores than this it RAISES concurrency instead of
# lowering it, multiplying peak memory rather than trimming CPU. A build host that competes with
# nothing therefore sets `CARGO_BUILD_JOBS` to its own width and ignores this file.
[build]
jobs = 12
