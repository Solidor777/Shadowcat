[package]
name = "shadowcat"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", features = ["uuid-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
argon2 = { version = "0.5", features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
dashmap = "6"
hecs = "0.11"
polyanya = { version = "0.16", default-features = false }
geo = "0.32"
glam = "0.30"
futures-util = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rust-embed = "8"
mime_guess = "2"
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core", "signed"] }
base64 = "0.22"
subtle = "2"
# Per-world export/import bundle format (`world_bundle`): synchronous, no_std-friendly
# tar archive reader/writer. No compression feature enabled — the bundle format is
# uncompressed `.tar`, trading archive size for a format any standard `tar` tool can
# inspect/repair without a Shadowcat-specific decoder.
tar = "0.4"
ammonia = "4.1.3"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
# Server's first outbound HTTP (`chat::link_preview`, SSRF-guarded). rustls-tls
# keeps TLS pure-Rust (no OpenSSL system dep, cross-platform CI invariant);
# Production preview fetcher needs only `rustls-tls` (pure-Rust TLS, no OpenSSL —
# cross-platform) + `stream` (`bytes_stream()` for the size-capped body read); the
# preview client is deliberately cookie-free. json/cookies/multipart are added under
# [dev-dependencies] (feature-unioned only for test builds) so the RELEASE binary
# does not carry the cookie-jar/multipart/json machinery the integration tests use.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
# Asset pipeline (`data::asset::process`): decode/resize via `image` (pure Rust
# codecs; PNG/JPEG/GIF/BMP/TIFF/WebP decode), lossy + lossless WebP encode via
# libwebp (`webp`, built by `cc` on every CI runner — no system package). No
# FFmpeg; both crates are BSD-licensed.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
webp = "0.3"
# `GET /api/worlds/{world}/assets?name_regex=` — linear-time matcher with
# compile-size caps, so an untrusted pattern cannot stall the server.
regex = "1"

# Embeds the application icon into the Windows executable (see build.rs); a
# no-op on other targets, so it never affects the Linux/macOS binaries.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# The shared WS harness the integration tests drive. A path dependency rather than a
# tests/common module include: a pub item in a library is reachable by definition, so the
# harness needs no dead-code suppression for the helpers a given test binary does not call.
shadowcat-test-support = { path = "test-support" }
# The integration tests (tests/*.rs) drive the test server via reqwest's
# higher-level json/cookie-jar/multipart API. Cargo unions these with the
# [dependencies] features for test builds only — the release binary keeps just
# rustls-tls + stream (same crate + version, no resolution split).
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart"] }
proptest = "1"
tempfile = "3"
axum-test = "17"
tokio-tungstenite = "0.24"
futures-util = "0.3"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
