[package]
name = "shadowcat-test-support"
version = "0.1.0"
edition = "2021"
# Never published and never a runtime dependency: this crate exists solely as a
# [dev-dependencies] entry of `shadowcat`, so its code compiles for test builds only and
# cannot reach the release binary.
publish = false

[dependencies]
# The crate under test. This is a dev-dependency cycle (shadowcat dev-depends on
# shadowcat-test-support, which depends on shadowcat) — permitted by Cargo, because a
# dev-dependency never participates in building the library itself.
shadowcat = { path = ".." }

axum = { version = "0.8", features = ["ws", "http2"] }
dashmap = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "cookies",
    "multipart",
] }
serde_json = "1"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# The TLS-capable harness dials the server with rustls clients under the explicit ring provider
# (the dependency graph must never contain a second TLS backend; `pnpm lint:crypto-backend` proves it).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ring = "0.17"
h2 = "0.4"
# The vendored-h2 reproducer drives hyper's h2 server, whose per-stream tasks hold the stream
# handles in the order production does.
hyper = { version = "1", default-features = false, features = ["server", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
