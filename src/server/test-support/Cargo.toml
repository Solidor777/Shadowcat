[package]
name = "shadowcat-test-support"
version = "0.1.0"
edition = "2021"
# Never published and never a runtime dependency: this crate exists solely as a
# [dev-dependencies] entry of `shadowcat`, so its code compiles for test builds only and
# cannot reach the release binary.
publish = false

[dependencies]
# The crate under test. This is a dev-dependency cycle (shadowcat dev-depends on
# shadowcat-test-support, which depends on shadowcat) — permitted by Cargo, because a
# dev-dependency never participates in building the library itself.
shadowcat = { path = ".." }

axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "cookies",
    "multipart",
] }
serde_json = "1"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-tungstenite = "0.24"
url = "2"
uuid = { version = "1", features = ["v4"] }
