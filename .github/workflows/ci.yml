name: CI

on:
  push:
  pull_request:

# Job timeouts bound a hang, not a regression: each is twice the longest successful run among the
# last 100 completed runs of this workflow (per job, and per OS leg for `rust`), rounded up to five
# minutes. Longest successful run, minutes: rust windows 60.8, rust macos 28.9, rust ubuntu 23.3,
# web 8.8, e2e 5.5, ui-e2e 16.6, docs 11.7. `audio-fixtures` has no run history yet; its 30 is sized from the
# measured local regeneration of the three 20-minute tracks and is re-derived from the recorded runs
# once they exist. `e2e-long-audio` (90) and the two `e2e-long-audio-playthrough-*` jobs (50, about 20
# minutes of real-time playback each) have no run history either and are re-derived the same way.
# Without one a hung job runs to the platform's six hours.
jobs:
  rust:
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 125 || matrix.os == 'macos-latest' && 60 || 50 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # The server embeds the client bundle (dist/), so build it before any cargo
      # step (the embed test reads it; the release build embeds it at compile time).
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build client bundle (embedded by the server)
        run: pnpm build
      # The vendored h2 is hashed on every OS (a Windows checkout must hash like the stored LF) and
      # compared with the real upstream archive, which needs the network.
      # The script ends its own download after 60 s (DOWNLOAD_DEADLINE_MS); the step bound is five
      # times that, so only a hang outside the download reaches it.
      - name: Vendored h2 equals upstream plus the committed patch (all OSes)
        timeout-minutes: 5
        run: pnpm lint:vendor:upstream
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # The audio-monitor subcommand's Linux backend binds the system PipeWire
      # library; the sys crate discovers it via pkg-config.
      - name: Install PipeWire dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      # The repo pins a build-parallelism budget for a desktop the build shares with its user.
      # Cargo does not clamp that value to the host's parallelism, so on a runner with fewer
      # cores it raises concurrent rustc instead of lowering it and multiplies peak memory --
      # which a runner pays for as an allocation failure, not as slowness. Cargo reads this
      # variable ahead of the config file, so each runner builds at its own width. The fallback
      # chain covers the three images without depending on one tool being present on all of them.
      - name: Build parallelism (runner width, not the repo's desktop budget)
        shell: bash
        run: |
          n=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-2}")
          echo "runner parallelism: $n"
          echo "CARGO_BUILD_JOBS=$n" >> "$GITHUB_ENV"
      # Format is OS-independent; run once to avoid redundant matrix cost.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # Clippy runs on every OS so cfg-gated code is linted on its own target.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Doc coverage (all OSes; cfg-gated backends only compile on their own OS)
        run: cargo clippy --all-targets -- -D missing-docs -D clippy::missing-docs-in-private-items
      - name: Test (emits ts-rs bindings)
        run: cargo test --all
      # ts-rs regenerates bindings on test; the LF-committed files only match a
      # Linux regen (a Windows working-tree regen may differ on EOL), so the
      # sync check is Linux-only. .gitattributes pins these files to LF.
      - name: ts-rs bindings in sync
        if: runner.os == 'Linux'
        run: git diff --exit-code src/types/generated
      - name: Release build
        run: cargo build --release
      # The send-buffer keep criterion (H2_SEND_BUF_BYTES against the library default) is defined
      # for the release profile: a debug build's per-frame cost dominates the loopback download
      # and reads 0.66 to 0.79 where release reads above 0.94. Record-only: every run prints its
      # buffer_ratio and production_ratio per OS leg (stdout, and the step summary), and asserts
      # only that every download delivers every byte.
      - name: Send-buffer throughput gate (release, record-only)
        run: cargo test --release -p shadowcat --test h2_send_buf_gate -- --nocapture
      # Replace and delete over a file a reader holds open: the contract is asserted and the
      # observed values are recorded per OS leg (stdout, and the step summary).
      - name: Asset replace/delete with an open reader (all OSes, recorded)
        run: cargo test -p shadowcat --test asset_open_handle -- --nocapture --test-threads 1
      - name: Binary size budget
        run: pnpm lint:binary-size
      # Assemble the icon-carrying distributable. Windows is excluded: the icon
      # is embedded in the .exe at build time (build.rs). macOS -> .app (.icns);
      # Linux -> staging tree with a .desktop entry + hicolor PNG.
      - name: Package (icon bundle)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package.sh "${{ runner.os == 'macOS' && 'macos' || 'linux' }}"
      - name: Upload package
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: shadowcat-${{ runner.os }}
          path: target/package/

  web:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm run test:scripts
      - run: pnpm docs:check-examples
      - run: pnpm lint
      - run: pnpm build
      - name: Build worked examples (guide code must stay buildable)
        run: pnpm --filter "shadowcat-example-*" build
      # Guards the single-instance-runtime import map: fails the build if any
      # svelte/* subpath import isn't enumerated in RUNTIME_ENTRIES.
      - run: pnpm run check:svelte-runtime

  # Cross-runtime end-to-end: the real @shadowcat/core client driven against the
  # real Rust test_server. Needs both toolchains, so it is its own single-OS job
  # (the rust matrix already proves cross-OS build; this proves the boundary).
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The audio-monitor subcommand's Linux backend binds the system PipeWire
      # library; the test_server build below compiles the server crate on this leg.
      - name: Install PipeWire dev headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      # The shadowcat lib embeds dist/ (rust-embed requires the folder at compile
      # time), so the client must be built before any cargo build of the server.
      - run: pnpm build
      # Pre-build the server so the in-test spawn does not pay the compile cost.
      - run: cargo build -p shadowcat --bin test_server
      - run: pnpm --filter @shadowcat/core test:e2e

  # Browser end-to-end: the built `shadowcat` binary serves the embedded SPA + /api
  # on one origin; Playwright drives the entry flow against it. Needs both
  # toolchains: the `e2e` script itself runs `vite build && cargo build` before
  # invoking Playwright, because Playwright starts its `webServer` ahead of any
  # setup hook, so the binary must already exist. Hence its own single-OS job.
  ui-e2e:
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The audio-monitor subcommand's Linux backend binds the system PipeWire
      # library; the `e2e` script below runs `cargo build` on this leg.
      - name: Install PipeWire dev headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      - run: pnpm --filter @shadowcat/shell exec playwright install --with-deps chromium firefox
      - run: pnpm --filter @shadowcat/shell e2e:build
      - run: pnpm --filter @shadowcat/shell exec playwright test --project=loopback --project=media-range-loopback --project=webm-decode-chromium --project=webm-decode-firefox
      # The traces this uploads are the only forensic channel for a failure that
      # reproduces on the runner but not locally; `playwright.config.ts` retains
      # them on failure solely because this step collects them. `if: failure()`
      # (not `always()`) keeps green runs from uploading an empty directory.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: src/client/shell/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Plain-HTTP LAN play and built-in HTTPS in real browsers, on every OS the server ships for.
  # Browser engines differ per OS (certificate-error wording, HTTPS-upgrade branches, loopback
  # mixed-content rules), so each expected outcome in the specs is keyed by (project, platform)
  # and a cell measured on one OS only FAILS here on the others, reporting what it observed, so the
  # first run on each OS supplies the measurement.
  # The loopback suite keeps its single Ubuntu placement above: it drives no per-OS behaviour.
  ui-e2e-https:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PipeWire dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      - run: pnpm --filter @shadowcat/shell exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @shadowcat/shell e2e:build
      # The Chromium HTTPS-First prompt is browser UI, reachable only through the platform's
      # accessibility API: Windows UI Automation, macOS System Events, Linux AT-SPI (the drivers
      # under src/client/shell/e2e-support/invoke-button.*). Linux needs a virtual display, a
      # session bus and the accessibility bus; the macOS and Linux drivers depend on the platform
      # accessibility API and on the accessibility flag the launcher passes.
      - name: Install the Linux accessibility driver dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb at-spi2-core dbus-x11 python3-gi gir1.2-atspi-2.0
      - name: Chromium HTTPS-First interstitial (browser-UI driver)
        shell: bash
        run: |
          interstitial='pnpm --filter @shadowcat/shell exec playwright test --project=https-upgrade-chromium --project=https-upgrade-chromium-named --grep "Continue to site"'
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- xvfb-run -a bash -c "(/usr/libexec/at-spi-bus-launcher --launch-immediately &) ; sleep 2 ; dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus org.freedesktop.DBus.Properties.Set string:org.a11y.Status string:IsEnabled variant:boolean:true ; $interstitial"
          else
            eval "$interstitial"
          fi
      - run: pnpm --filter @shadowcat/shell exec playwright test --project=lan-plain-http --project="https-*" --grep-invert "Continue to site"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-https-${{ matrix.os }}
          path: src/client/shell/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Long-audio streaming in real browsers: NON-looping 20-minute entries over both Opus derivative
  # containers, sampled (about a minute from the start, a server `Seek` to 15 seconds before the end,
  # the natural end, the wrap), on h1 and h2. The server is the release build because the import
  # transcodes 20-minute tracks. Runs alone with one worker; the timeout is a placeholder bound until
  # recorded runs exist.
  e2e-long-audio:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    env:
      SHADOWCAT_E2E_PROFILE: release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PipeWire dev headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      - run: pnpm --filter @shadowcat/shell exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @shadowcat/shell e2e:build:release
      - run: pnpm --filter @shadowcat/shell exec playwright test --project=long-audio-https-chromium --project=long-audio-http-chromium --project=long-audio-https-chromium-noflag --project=long-audio-https-firefox --project=long-audio-https-webkit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-long-audio
          path: src/client/shell/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # One full 20-minute real-time play-through of one track over plain HTTP (h1). Its own job so it
  # runs in parallel with the h2 play-through and the sampled legs.
  e2e-long-audio-playthrough-h1:
    timeout-minutes: 50
    runs-on: ubuntu-24.04
    env:
      SHADOWCAT_E2E_PROFILE: release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PipeWire dev headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      - run: pnpm --filter @shadowcat/shell exec playwright install --with-deps chromium
      - run: pnpm --filter @shadowcat/shell e2e:build:release
      - run: pnpm --filter @shadowcat/shell exec playwright test --project=long-audio-playthrough-http-chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-long-audio-playthrough-h1
          path: src/client/shell/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # One full 20-minute real-time play-through of one track over HTTPS (h2). Its own job so it runs in
  # parallel with the h1 play-through and the sampled legs.
  e2e-long-audio-playthrough-h2:
    timeout-minutes: 50
    runs-on: ubuntu-24.04
    env:
      SHADOWCAT_E2E_PROFILE: release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PipeWire dev headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      - run: pnpm --filter @shadowcat/shell exec playwright install --with-deps chromium
      - run: pnpm --filter @shadowcat/shell e2e:build:release
      - run: pnpm --filter @shadowcat/shell exec playwright test --project=long-audio-playthrough-https-chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-long-audio-playthrough-h2
          path: src/client/shell/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Regenerates the committed long-audio e2e fixtures and compares them with the committed files
  # (scripts/check-audio-fixtures.mjs). The runner images carry python but not ffmpeg, NumPy or
  # SciPy, so the tools are installed here and --require-tools makes a missing one fatal rather than
  # a skip. Byte equality of the .ogg files is enforced only when the installed ffmpeg and NumPy
  # match the manifest's recorded versions; the structural tier always runs.
  audio-fixtures:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg and the NumPy/SciPy generator dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-numpy python3-scipy
      - name: Committed audio fixtures equal a regeneration
        run: pnpm lint:audio-fixtures

  # Docs pipeline: portal + generated references assembled and link-checked.
  # Single-OS: the docs site is a build artifact, not platform-gated code; the
  # rust matrix already proves the crate compiles per-OS.
  #
  # Every step here is a gate. None is warn-tier: a check that reports a violation
  # without failing grandfathers whatever existed when it was added, and a
  # grandfathered violation is indistinguishable to every later reader from code
  # that was checked and passed. The one non-gating output is the documentation
  # exemption count printed at the tail of build:all, which reports rather than
  # fails — it exists so an exemption cannot be active and uncounted, and the
  # exemptions it names are themselves gated: an entry that stops matching becomes
  # an unused-exemption warning, and warnings here are fatal.
  docs:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The audio-monitor subcommand's Linux backend binds the system PipeWire
      # library; cargo doc below compiles the server crate on this leg.
      - name: Install PipeWire dev headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      # build:all starts with the client build (rust-embed needs dist/ before
      # cargo doc), then typedoc, cargo doc, vitepress, assembly + link check,
      # and finally the active documentation-exemption count. cargo doc runs
      # through scripts/cargo-doc-strict.mjs, which sets RUSTDOCFLAGS itself —
      # the same flag a local `pnpm build:all` carries, so this step and a
      # contributor's own machine see the same gate.
      - run: pnpm build:all
      - name: Function doc coverage (TS)
        run: pnpm lint:docs
      - name: Property and type doc coverage (TS)
        run: pnpm lint:props
      - name: No ephemeral references in code comments
        run: pnpm lint:comments
      - name: No dead-code or unused-item suppressions
        run: pnpm lint:allowances
      - name: File-size limits (soft 5000 / hard 10000 lines)
        run: pnpm lint:file-size
      - name: No inline Rust test-module bodies
        run: pnpm lint:inline-tests
      - name: No outer doc on a Rust mod item (module docs live in the module's own //! block)
        run: pnpm lint:module-docs
      - name: No secure-context-only APIs (LAN plain-HTTP play)
        run: pnpm lint:secure-context
      - name: No second TLS crypto backend (ring only)
        run: pnpm lint:crypto-backend
      - name: Vendored crates hold nothing but upstream plus the committed patch
        run: pnpm lint:vendor
      - name: No i18n keys as accessible text
        run: pnpm lint:aria-labels
      - name: Gate manifest matches CI
        run: pnpm lint:gate-manifest
      - name: No personal data in tracked agent settings
        run: pnpm lint:settings-privacy
      - name: Doc examples typecheck (TS)
        run: pnpm docs:check-examples
      - name: Doc coverage (Rust)
        run: cargo clippy --manifest-path src/server/Cargo.toml --all-targets -- -D missing-docs -D clippy::missing-docs-in-private-items
      # rustdoc's missing_doc_code_examples lint is nightly-only, so this step needs the nightly
      # toolchain. The script sets RUSTDOCFLAGS itself (scripts/cargo-doc-strict.mjs, examples
      # mode), so this step and a local `pnpm docs:check-rust-examples` run one invocation: an
      # `env:` block on a run: step is environment the local gate tier never applies, and the
      # gate manifest refuses to tier such a step commit/push.
      - uses: dtolnay/rust-toolchain@nightly
      - name: Doc examples present (Rust)
        run: pnpm docs:check-rust-examples
      - name: Upload docs site
        uses: actions/upload-artifact@v4
        with:
          name: dist-docs
          path: dist-docs/
