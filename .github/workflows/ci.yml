name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # The server embeds the client bundle (dist/), so build it before any cargo
      # step (the embed test reads it; the release build embeds it at compile time).
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build client bundle (embedded by the server)
        run: pnpm --filter @shadowcat/shell build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Format is OS-independent; run once to avoid redundant matrix cost.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # Clippy runs on every OS so cfg-gated code is linted on its own target.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (emits ts-rs bindings)
        run: cargo test --all
      # ts-rs regenerates bindings on test; the LF-committed files only match a
      # Linux regen (a Windows working-tree regen may differ on EOL), so the
      # sync check is Linux-only. .gitattributes pins these files to LF.
      - name: ts-rs bindings in sync
        if: runner.os == 'Linux'
        run: git diff --exit-code src/types/generated
      - name: Release build
        run: cargo build --release
      - name: Binary size budget
        shell: bash
        run: |
          bin="target/release/shadowcat${{ runner.os == 'Windows' && '.exe' || '' }}"
          size=$(wc -c < "$bin")
          echo "release binary size: ${size} bytes"
          # 60 MiB guardrail; tighten as the binary's real baseline settles.
          test "${size}" -lt 62914560
      # Assemble the icon-carrying distributable. Windows is excluded: the icon
      # is embedded in the .exe at build time (build.rs). macOS -> .app (.icns);
      # Linux -> staging tree with a .desktop entry + hicolor PNG.
      - name: Package (icon bundle)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package.sh "${{ runner.os == 'macOS' && 'macos' || 'linux' }}"
      - name: Upload package
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: shadowcat-${{ runner.os }}
          path: target/package/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm run test:scripts
      - run: pnpm docs:check-examples
      - run: pnpm lint
      - run: pnpm --filter @shadowcat/shell build
      - name: Build worked examples (guide code must stay buildable)
        run: pnpm --filter "shadowcat-example-*" build
      # Guards the single-instance-runtime import map: fails the build if any
      # svelte/* subpath import isn't enumerated in RUNTIME_ENTRIES.
      - run: pnpm run check:svelte-runtime

  # Cross-runtime end-to-end: the real @shadowcat/core client driven against the
  # real Rust test_server. Needs both toolchains, so it is its own single-OS job
  # (the rust matrix already proves cross-OS build; this proves the boundary).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The shadowcat lib embeds dist/ (rust-embed requires the folder at compile
      # time), so the client must be built before any cargo build of the server.
      - run: pnpm --filter @shadowcat/shell build
      # Pre-build the server so the in-test spawn does not pay the compile cost.
      - run: cargo build -p shadowcat --bin test_server
      - run: pnpm --filter @shadowcat/core test:e2e

  # Browser end-to-end: the built `shadowcat` binary serves the embedded SPA + /api
  # on one origin; Playwright drives the entry flow against it. Needs both
  # toolchains: the `e2e` script itself runs `vite build && cargo build` before
  # invoking Playwright, because Playwright starts its `webServer` ahead of any
  # setup hook, so the binary must already exist. Hence its own single-OS job.
  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shadowcat/shell exec playwright install --with-deps chromium
      - run: pnpm --filter @shadowcat/shell e2e
      # The traces this uploads are the only forensic channel for a failure that
      # reproduces on the runner but not locally; `playwright.config.ts` retains
      # them on failure solely because this step collects them. `if: failure()`
      # (not `always()`) keeps green runs from uploading an empty directory.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: src/client/shell/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Docs pipeline: portal + generated references assembled and link-checked.
  # Single-OS: the docs site is a build artifact, not platform-gated code; the
  # rust matrix already proves the crate compiles per-OS. The two report steps
  # are warn-tier (exit 0) until the sweep phases ratchet lints to deny.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      # docs:build starts with the client build (rust-embed needs dist/ before
      # cargo doc), then typedoc, cargo doc, vitepress, assembly + link check.
      - run: pnpm docs:build
      - name: Doc-coverage report (TS, informational)
        run: pnpm lint:docs
      - name: Doc-coverage report (Rust, informational)
        run: cargo clippy --manifest-path src/server/Cargo.toml --all-targets -- -W missing-docs -W clippy::missing-docs-in-private-items
      # Example-presence report: rustdoc's missing_doc_code_examples lint is
      # nightly-only; -W keeps it warn-tier (exit 0). continue-on-error covers
      # nightly toolchain breakage (spec degradation clause: non-blocking until repaired).
      - uses: dtolnay/rust-toolchain@nightly
      - name: Example-presence report (Rust, nightly, informational)
        continue-on-error: true
        env:
          RUSTDOCFLAGS: "-W rustdoc::missing_doc_code_examples"
        run: cargo +nightly doc --manifest-path src/server/Cargo.toml --document-private-items --no-deps --target-dir target/nightly-doc
      - name: Upload docs site
        uses: actions/upload-artifact@v4
        with:
          name: dist-docs
          path: dist-docs/
