[[gate]]
workflow = "ci.yml"
job = "ui-e2e"
command = "pnpm --filter @shadowcat/shell exec playwright install --with-deps chromium firefox"
tier = "setup"
reason = "Installs the Chromium build the loopback browser e2e step drives; a prerequisite, not a check in its own right."

[[gate]]
workflow = "ci.yml"
job = "ui-e2e"
command = "pnpm --filter @shadowcat/shell e2e:build"
tier = "setup"
reason = "Builds the client bundle and the server binary the browser e2e step serves; Playwright starts its webServer before any setup hook, so the binary must exist first."

[[gate]]
workflow = "ci.yml"
job = "ui-e2e"
command = "pnpm --filter @shadowcat/shell exec playwright test --project=loopback --project=media-range-loopback --project=webm-decode-chromium --project=webm-decode-firefox"
tier = "ci-only"
reason = "The loopback browser end-to-end suite and the media-range spec, which runs against a server of its own with a short egress window, one of the end-to-end jobs that stay in CI outside the local tiers. playwright.config.ts reuses any server already holding a fixed port outside CI, so on a developer machine the run can drive another session's binary and its result cannot be attributed to this tree; only CI's isolated runner binds those ports to the tree under test."

[[gate]]
workflow = "ci.yml"
job = "ui-e2e-https"
command = "pnpm install --frozen-lockfile"
tier = "setup"
reason = "Installs the workspace's node dependencies every later step imports."

[[gate]]
workflow = "ci.yml"
job = "ui-e2e-https"
