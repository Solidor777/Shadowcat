job = "ui-e2e-https"
command = "pnpm --filter @shadowcat/shell exec playwright install --with-deps chromium firefox webkit"
tier = "setup"
reason = "Installs the Chromium, Firefox and WebKit builds the HTTPS projects drive on every OS; a prerequisite, not a check in its own right."

[[gate]]
workflow = "ci.yml"
job = "ui-e2e-https"
command = "pnpm --filter @shadowcat/shell e2e:build"
tier = "setup"
reason = "Builds the client bundle and the server binary the HTTPS projects serve; Playwright starts its webServer before any setup hook, so the binary must exist first."

[[gate]]
workflow = "ci.yml"
job = "ui-e2e-https"
command = "sudo apt-get install -y xvfb at-spi2-core dbus-x11 python3-gi gir1.2-atspi-2.0"
tier = "ci-only"
reason = "Installs the virtual display, session bus and AT-SPI packages the Linux browser-UI driver needs; apt-get with sudo exists only on the Ubuntu runner, never on a Windows/macOS developer machine."

[[gate]]
workflow = "ci.yml"
job = "ui-e2e-https"
command = "interstitial='pnpm --filter @shadowcat/shell exec playwright test --project=https-upgrade-chromium --project=https-upgrade-chromium-named --grep \"Continue to site\"' if [ \"$RUNNER_OS\" = \"Linux\" ]; then dbus-run-session -- xvfb-run -a bash -c \"(/usr/libexec/at-spi-bus-launcher --launch-immediately &) ; sleep 2 ; dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus org.freedesktop.DBus.Properties.Set string:org.a11y.Status string:IsEnabled variant:boolean:true ; $interstitial\" else eval \"$interstitial\" fi"
tier = "ci-only"
reason = "Drives Chromium's HTTPS-First prompt, which is browser UI reachable only through the platform accessibility API (UI Automation, System Events, AT-SPI). It needs a real browser window, on Linux a virtual display and accessibility bus, on macOS a granted accessibility permission, and the fixed HTTPS port and non-loopback address the other HTTPS projects use, so only CI's isolated runners are a faithful target."

[[gate]]
workflow = "ci.yml"
job = "ui-e2e-https"
command = "pnpm --filter @shadowcat/shell exec playwright test --project=lan-plain-http --project=\"https-*\" --grep-invert \"Continue to site\""
tier = "ci-only"
reason = "Plain-HTTP LAN play and built-in HTTPS in real browsers on the three-OS matrix, apart from the interstitial driver run by the step above. The projects browse to the machine's own non-loopback address and hold fixed ports (32000, 32001) that playwright.config.ts reuses outside CI, so a developer machine can drive another session's binary; only CI's isolated runner binds them to the tree under test."

